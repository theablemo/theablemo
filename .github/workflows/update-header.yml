name: Refresh profile header

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_header.py
      - .github/workflows/update-header.yml

permissions:
  contents: write

concurrency:
  group: profile-header
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check data handling
        run: python3 -m unittest discover -s tests
      - name: Refresh public data and render header
        run: python3 scripts/update_header.py
      - name: Commit updated header
        run: |
          git add profile/header-light.svg profile/header-dark.svg profile/header-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile header data'
          git push origin HEAD:main
